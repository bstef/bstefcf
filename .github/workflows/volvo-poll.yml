name: Volvo trip poll

on:
  schedule:
    # Volvo's public API exposes current location, not trip history.
    # This workflow periodically calls our Pages Function so the app can
    # build trip history from consecutive location samples stored in D1.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/volvo/poll
        env:
          POLL_URL: ${{ secrets.VOLVO_POLL_URL }}
          POLL_SECRET: ${{ secrets.VOLVO_POLL_SECRET }}
        run: |
          if [ -z "$POLL_URL" ] || [ -z "$POLL_SECRET" ]; then
            echo "::notice::Volvo trip polling is not configured. Set VOLVO_POLL_URL and VOLVO_POLL_SECRET repo secrets to enable it."
            exit 0
          fi

          curl -sS -f -X POST "$POLL_URL" \
            -H "authorization: Bearer $POLL_SECRET" \
            -H "content-length: 0"
