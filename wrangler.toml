name = "bstefcf"
pages_build_output_dir = "."
compatibility_date = "2024-09-23"

# Volvo dashboard's trip log + OAuth token store.
# Create with: wrangler d1 create bstefcf-volvo
# then paste the returned database_id below (or set it in the
# Cloudflare Pages dashboard under Settings -> Functions -> D1 database bindings,
# binding name "VOLVO_DB", if this project deploys via git integration rather
# than `wrangler pages deploy`).
[[d1_databases]]
binding = "VOLVO_DB"
database_name = "bstefcf-volvo"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
