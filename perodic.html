.dot { width:6px; height:6px; border-radius:2px; display:inline-block; flex-shrink:0; }

.layout { display:flex; gap:10px; align-items:flex-start; }
.grid-wrap { overflow-x:auto; flex:1 1 auto; }
.grid {
  display:grid;
  grid-template-columns: repeat(18, minmax(32px, 44px));
  grid-template-rows: repeat(10, minmax(40px, 48px));
  gap:2px;
  min-width:620px;
}
.cell { cursor:pointer; border-radius:4px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:2px; border:1px solid transparent; transition:transform 0.12s, box-shadow 0.12s, opacity 0.12s; position:relative; }
.cell:hover { transform:scale(1.15); z-index:10; }
.cell.dimmed { opacity:0.1; }
.cell.selected { box-shadow:0 0 14px currentColor; }
.cell .num { font-size:7px; opacity:0.6; line-height:1; }
.cell .sym { font-family:'Orbitron',monospace; font-size:clamp(10px,1.4vw,14px); font-weight:700; line-height:1.15; }
.cell .nam { font-size:6px; opacity:0.7; line-height:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%; }
.placeholder { border-radius:4px; display:flex; align-items:center; justify-content:center; font-size:8px; }
.period-lbl { display:flex; align-items:center; padding-left:3px; font-size:8px; color:rgba(255,255,255,0.2); font-family:'Orbitron',monospace; }
.series-lbl { display:flex; align-items:center; justify-content:flex-end; padding-right:4px; font-size:7px; line-height:1.3; text-align:right; }
.panel { width:200px; min-width:190px; flex-shrink:0; background:rgba(255,255,255,0.03); border:1px solid rgba(255,255,255,0.08); border-radius:8px; overflow:hidden; min-height:280px; }
.panel-bar { height:4px; width:100%; }
.panel-body { padding:12px; }
.panel-sym { font-family:'Orbitron',monospace; font-size:32px; font-weight:900; line-height:1; }
.panel-name { font-size:13px; font-weight:700; color:#e2e8f0; margin-top:3px; }
.panel-z { font-size:10px; color:rgba(255,255,255,0.4); margin-top:1px; }
.panel-tag { margin-top:8px; padding:3px 8px; border-radius:4px; font-size:10px; display:inline-block; }
.panel-grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 8px; margin-top:12px; }
.panel-lbl { font-size:9px; color:rgba(255,255,255,0.3); letter-spacing:0.07em; }
.panel-val { font-size:11px; color:#e2e8f0; margin-top:1px; word-break:break-word; }
.panel-disc { margin-top:12px; padding-top:10px; border-top:1px solid rgba(255,255,255,0.06); }
.panel-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:280px; text-align:center; padding:20px; }
.panel-icon { font-size:28px; opacity:0.25; margin-bottom:10px; }
.panel-hint { font-size:11px; color:rgba(255,255,255,0.25); line-height:1.6; }
.hover-tag { margin-top:14px; padding:5px 12px; border-radius:4px; font-size:11px; }
.footer { display:flex; justify-content:center; gap:14px; margin-top:12px; flex-wrap:wrap; }
.footer-item { display:flex; align-items:center; gap:4px; font-size:9px; color:rgba(255,255,255,0.3); }

function getPos(el){
  if(el.cat==="lanthanide"&&el.n>=57&&el.n<=71) return{row:9,col:el.n-57+4};
  if(el.cat==="actinide"&&el.n>=89&&el.n<=103) return{row:10,col:el.n-89+4};
  if(el.grp) return{row:el.per,col:el.grp};
  return null;
}

let activeFilter=null, selectedEl=null;

function buildCatButtons(){
  const wrap=document.getElementById('cat-buttons');
  Object.entries(CAT).forEach(([key,val])=>{
    const btn=document.createElement('button');
    btn.className='cat-btn'; btn.id='cat-'+key; btn.style.color=val.color;
    btn.innerHTML=`<span class="dot" style="background:${val.color}"></span>${val.label}`;
    btn.onclick=()=>{
      activeFilter=activeFilter===key?null:key;
      document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
      if(activeFilter) btn.classList.add('active');
      applyFilters();
    };
    wrap.appendChild(btn);
  });
}

function buildGrid(){
  const grid=document.getElementById('grid');
  for(let p=1;p<=7;p++){
    const lbl=document.createElement('div');
    lbl.className='period-lbl'; lbl.style.gridRow=p; lbl.style.gridColumn=19;
    lbl.textContent='P'+p; grid.appendChild(lbl);
  }
  const ln=document.createElement('div');
  ln.className='series-lbl'; ln.style.gridRow=9; ln.style.gridColumn='1/3';
  ln.style.color=CAT['lanthanide'].color+'99'; ln.innerHTML='Ln<br>series'; grid.appendChild(ln);
  const ac=document.createElement('div');
  ac.className='series-lbl'; ac.style.gridRow=10; ac.style.gridColumn='1/3';
  ac.style.color=CAT['actinide'].color+'99'; ac.innerHTML='Ac<br>series'; grid.appendChild(ac);
  [{row:6,col:3,cat:'lanthanide',txt:'57–71'},{row:7,col:3,cat:'actinide',txt:'89–103'}].forEach(p=>{
    const ph=document.createElement('div'); ph.className='placeholder';
    ph.style.gridRow=p.row; ph.style.gridColumn=p.col;
    ph.style.border=`1px dashed ${CAT[p.cat].color}44`; ph.style.color=CAT[p.cat].color+'77';
    ph.style.fontSize='8px'; ph.textContent=p.txt; grid.appendChild(ph);
  });
  EL.forEach(el=>{
    const pos=getPos(el); if(!pos) return;
    const c=CAT[el.cat];
    const cell=document.createElement('div');
    cell.className='cell'; cell.id='el-'+el.n; cell.dataset.n=el.n;
    cell.style.gridRow=pos.row; cell.style.gridColumn=pos.col;
    cell.style.background=c.bg; cell.style.borderColor=c.color+'55'; cell.style.color=c.color;
    cell.innerHTML=`<span class="num">${el.n}</span><span class="sym">${el.s}</span><span class="nam">${el.name}</span>`;
    cell.onclick=()=>selectElement(el);
    cell.onmouseenter=()=>hoverElement(el);
    cell.onmouseleave=()=>hoverElement(null);
    grid.appendChild(cell);
  });
}

function buildFooter(){
  const footer=document.getElementById('footer');
  Object.entries(CAT).forEach(([key,val])=>{
    const count=EL.filter(e=>e.cat===key).length;
    const item=document.createElement('div'); item.className='footer-item';
    item.innerHTML=`<span class="dot" style="background:${val.color};border-radius:1px"></span>${val.label}: <strong style="color:${val.color}">${count}</strong>`;
    footer.appendChild(item);
  });
}

function applyFilters(){
  const search=document.getElementById('search').value.toLowerCase().trim();
  document.getElementById('clear-btn').style.display=(activeFilter||search)?'block':'none';
  EL.forEach(el=>{
    const cell=document.getElementById('el-'+el.n); if(!cell) return;
    const mc=!activeFilter||el.cat===activeFilter;
    const ms=!search||el.name.toLowerCase().includes(search)||el.s.toLowerCase().includes(search)||String(el.n).includes(search);
    cell.classList.toggle('dimmed',!mc||!ms);
  });
}

function clearAll(){
  activeFilter=null; document.getElementById('search').value='';
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  applyFilters();
}

function selectElement(el){
  if(selectedEl?.n===el.n){
    selectedEl=null;
    document.querySelectorAll('.cell').forEach(c=>c.classList.remove('selected'));
    showEmptyPanel(); return;
  }
  selectedEl=el;
  document.querySelectorAll('.cell').forEach(c=>c.classList.remove('selected'));
  const cell=document.getElementById('el-'+el.n);
  if(cell) cell.classList.add('selected');
  showPanel(el);
}

function hoverElement(el){
  if(selectedEl) return;
  const preview=document.getElementById('hover-preview');
  if(!preview) return;
  if(!el){preview.innerHTML='';return;}
  const c=CAT[el.cat];
  preview.innerHTML=`<div class="hover-tag" style="background:${c.bg};border:1px solid ${c.color}55;color:${c.color}">${el.s} — ${el.name}</div>`;
}

function fmt(val,unit){ return val!=null?val+' '+unit:'—'; }

function row(label,val){ return `<div><div class="panel-lbl">${label.toUpperCase()}</div><div class="panel-val">${val}</div></div>`; }

function showEmptyPanel(){
  document.getElementById('panel').innerHTML=`
    <div class="panel-empty">
      <div class="panel-icon">⚛</div>
      <div class="panel-hint">Click any element<br>to view its properties</div>
      <div id="hover-preview"></div>
    </div>`;
}

function showPanel(el){
  const c=CAT[el.cat];
  document.getElementById('panel').innerHTML=`
    <div class="panel-bar" style="background:${c.color}"></div>
    <div class="panel-body">
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div>
          <div class="panel-sym" style="color:${c.color}">${el.s}</div>
          <div class="panel-name">${el.name}</div>
          <div class="panel-z">Z = ${el.n}</div>
        </div>
        <div style="font-family:'Orbitron',monospace;font-size:16px;font-weight:700;color:${c.color};opacity:0.5">#${el.n}</div>
      </div>
      <div class="panel-tag" style="background:${c.bg};color:${c.color}">${c.label}</div>
      <div class="panel-grid">
        ${row('Atomic Mass',el.mass+' u')}
        ${row('Period',el.per)}
        ${row('Group',el.grp||'—')}
        ${row('Config',el.cfg)}
        ${row('Electronegativity',el.en??'—')}
        ${row('Melting Pt',fmt(el.mp,'°C'))}
        ${row('Boiling Pt',fmt(el.bp,'°C'))}
        ${row('Density',el.dens!=null?el.dens+' g/cm³':'—')}
      </div>
      <div class="panel-disc">
        <div class="panel-lbl">DISCOVERED BY</div>
        <div class="panel-val" style="margin-top:2px">${el.disc}</div>
        <div style="font-size:10px;color:rgba(255,255,255,0.4);margin-top:2px">${el.yr??'Known since antiquity'}</div>
      </div>
    </div>`;
}

buildCatButtons();
buildGrid();
buildFooter();
</script>
